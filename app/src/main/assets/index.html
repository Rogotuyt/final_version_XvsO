<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>XvsO</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#e3fbff;font-family:system-ui;background:radial-gradient(ellipse at 50% 20%,#12366c,#02091e 75%);display:flex;align-items:center;justify-content:center;padding:16px}.wrap{width:min(100%,440px);text-align:center}h1{margin:0;color:#48eaff;text-shadow:0 0 20px #00cfff;font-size:42px;letter-spacing:4px}.sub{color:#78a8db;margin:4px 0 20px}.modes{display:flex;gap:8px;margin-bottom:14px}.mode{flex:1;padding:12px;background:#0b2048;border:1px solid #1465bb;border-radius:12px;color:#bdefff;font-weight:bold}.active{border-color:#00eaff;box-shadow:0 0 12px #00bfff66;color:white}.status{min-height:28px;font-weight:700;margin:8px}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px;border:1px solid #1379d7;border-radius:22px;background:#071739;box-shadow:0 0 28px #006aff35}.cell{aspect-ratio:1;border-radius:14px;background:linear-gradient(145deg,#102a59,#06122c);border:1px solid #145eb6;font-size:clamp(48px,16vw,74px);font-weight:800;display:flex;align-items:center;justify-content:center;text-shadow:0 0 15px currentColor}.x{color:#19e8ff}.o{color:#ff9b12}.score{display:flex;justify-content:space-around;margin:15px;color:#9ccaff}.score b{display:block;font-size:23px;color:white}.actions{display:flex;gap:10px;margin-top:16px}.btn{flex:1;border:0;border-radius:14px;padding:14px;background:linear-gradient(90deg,#06bdf5,#2471ff);color:white;font-size:15px;font-weight:800}.secondary{background:#0c2047;border:1px solid #2471ff}</style></head><body><main class="wrap"><h1>XvsO</h1><div class="sub">NEON TIC-TAC-TOE • AI</div><div class="modes"><button class="mode active" id="ai">🤖 Против ИИ</button><button class="mode" id="two">👥 2 игрока</button></div><div class="status" id="status">Ваш ход — X</div><div class="board" id="board"></div><div class="score"><div>❌ X<b id="sx">0</b></div><div>Ничья<b id="sd">0</b></div><div>⭕ O<b id="so">0</b></div></div><div class="actions"><button class="btn" id="reset">Новая игра</button><button class="btn secondary" id="clear">Сброс счёта</button></div></main><script>let b=Array(9).fill(''),turn='X',mode='ai',done=false,score={X:0,O:0,D:0};const board=document.getElementById('board'),status=document.getElementById('status'),wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];function winner(a){for(const l of wins)if(a[l[0]]&&a[l[0]]===a[l[1]]&&a[l[1]]===a[l[2]])return a[l[0]];return a.every(Boolean)?'D':null}function render(){board.innerHTML='';b.forEach((v,i)=>{let c=document.createElement('button');c.className='cell '+v.toLowerCase();c.textContent=v;c.onclick=()=>play(i);board.appendChild(c)});sx.textContent=score.X;so.textContent=score.O;sd.textContent=score.D}function end(){let w=winner(b);if(!w)return false;done=true;if(w==='D'){score.D++;status.textContent='🤝 Ничья!'}else{score[w]++;status.textContent=(w==='X'?'❌':'⭕')+' Победа!'}render();return true}function play(i){if(done||b[i])return;b[i]=turn;if(end())return;turn=turn==='X'?'O':'X';status.textContent=turn==='X'?'Ваш ход — X':'Ход O';render();if(mode==='ai'&&turn==='O')setTimeout(aiMove,250)}function minimax(a,d,max){let w=winner(a);if(w==='O')return 10-d;if(w==='X')return d-10;if(w==='D')return 0;let best=max?-Infinity:Infinity;for(let i=0;i<9;i++)if(!a[i]){a[i]=max?'O':'X';let v=minimax(a,d+1,!max);a[i]='';best=max?Math.max(best,v):Math.min(best,v)}return best}function aiMove(){if(done)return;let best=-Infinity,move=-1;for(let i=0;i<9;i++)if(!b[i]){b[i]='O';let v=minimax(b,0,false);b[i]='';if(v>best){best=v;move=i}}if(move>=0){b[move]='O';if(end())return;turn='X';status.textContent='Ваш ход — X';render()}}function reset(){b=Array(9).fill('');turn='X';done=false;status.textContent='Ваш ход — X';render()}document.getElementById('reset').onclick=reset;document.getElementById('clear').onclick=()=>{score={X:0,O:0,D:0};reset()};ai.onclick=()=>{mode='ai';ai.classList.add('active');two.classList.remove('active');reset()};two.onclick=()=>{mode='two';two.classList.add('active');ai.classList.remove('active');reset()};render();</script></body></html>
